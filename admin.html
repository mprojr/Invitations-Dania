<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Anahis Invitations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="container">
            <h1>Admin Dashboard</h1>
            <div class="admin-nav">
                <a href="index.html">View Site</a>
                <button id="logoutBtn" style="display: none;">Logout</button>
            </div>
        </div>
    </header>

    <div id="loginSection" class="login-section">
        <div class="login-box">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <div id="dashboardSection" class="dashboard-section" style="display: none;">
        <div class="container">
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3 id="pendingCount">0</h3>
                    <p>Pending Requests</p>
                </div>
                <div class="stat-card">
                    <h3 id="acceptedCount">0</h3>
                    <p>Accepted</p>
                </div>
                <div class="stat-card">
                    <h3 id="completedCount">0</h3>
                    <p>Completed</p>
                </div>
            </div>

            <div class="filters">
                <h2>Customer Queue</h2>
                <div class="filter-controls">
                    <select id="statusFilter">
                        <option value="all">All Statuses</option>
                        <option value="pending" selected>Pending</option>
                        <option value="accepted">Accepted</option>
                        <option value="completed">Completed</option>
                        <option value="declined">Declined</option>
                    </select>
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="quinceanera">Quinceañera</option>
                        <option value="sweet16">Sweet 16</option>
                        <option value="other">Other</option>
                    </select>
                    <select id="sortFilter">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="eventDate">By Event Date</option>
                    </select>
                </div>
            </div>

            <div id="requestsList" class="requests-list">
                <p class="loading">Loading requests...</p>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
